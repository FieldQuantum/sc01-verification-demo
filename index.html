<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SC01 · 场景验证演示</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#203341;background:#f3f6f8;line-height:1.65}*{box-sizing:border-box}body{margin:0}header{background:#173b50;color:white;padding:28px max(24px,calc((100vw - 1240px)/2))}header small{color:#9ecad8;letter-spacing:2px}h1{font-size:28px;margin:4px 0}header p{margin:4px 0 18px;color:#cbdce5}.actions{display:flex;gap:10px;flex-wrap:wrap}button,.download{cursor:pointer;font:inherit;padding:8px 15px;border:1px solid #bbced9;border-radius:7px;background:white;color:#214456}button:hover,.download:hover{background:#e6f3f7}button:disabled{opacity:.4;cursor:default}.download{background:#d7f3ec}#integrity{font-size:13px;color:#cbdce5;margin-top:12px}.layout{max-width:1240px;margin:24px auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;padding:0 18px}nav{background:white;border:1px solid #dde6eb;border-radius:10px;padding:14px;height:calc(100vh - 40px);position:sticky;top:20px;overflow:auto}nav h2{font-size:13px;color:#617684;margin:16px 8px 5px}nav button{display:block;border:0;width:100%;text-align:left;font-size:14px;padding:6px 10px;margin:2px 0}nav button[aria-current=step]{background:#e1f1f4;color:#07566c;font-weight:600}article{background:white;border:1px solid #dde6eb;border-radius:10px;padding:26px;min-width:0}.step{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #e5ecef;padding-bottom:18px}.eyebrow{color:#397282;font-size:13px;margin-top:24px}h2{font-size:24px;margin:4px 0 14px}h3{font-size:16px;margin:24px 0 10px}.status{font-size:13px;background:#f0f5f7;padding:10px;border-radius:5px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;text-align:left;border-bottom:1px solid #e3eaee;vertical-align:top;overflow-wrap:anywhere}th{background:#f2f6f8;color:#536a78}td strong{color:#0b6875}.scroll{overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f5f8fa;padding:14px;border-radius:6px}details{margin:18px 0}summary{cursor:pointer;color:#286276}ul{padding-left:22px;font-size:14px}.images{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.images figure{margin:0;text-align:center;font-size:11px}.images img{display:block;width:100%;max-width:80px;margin:auto;image-rendering:pixelated;border:5px solid #eaf0f3;border-radius:6px}svg{width:100%;background:#f7fafb;border-radius:8px}.muted{color:#647c8a;font-size:13px}.hash{font-family:monospace;font-size:11px;overflow-wrap:anywhere}.error{padding:20px;color:#992c22}.footer{max-width:1240px;padding:0 22px 28px;margin:auto;color:#71838d;font-size:12px}@media(max-width:720px){.layout{grid-template-columns:1fr}nav{height:auto;position:static;max-height:240px}article{padding:16px}.images{grid-template-columns:repeat(4,1fr)}h1{font-size:23px}}
</style></head><body>
<header><small>模型测试平台 · 场景验证</small><h1 id="title">SC01 · 真实手写数字识别与分拣</h1><p>预置真实样例 · 五大类28项 · 无需安装或导入数据</p><div class="actions"><button class="download" id="pdf" disabled>下载完整PDF报告</button><button id="json" disabled>下载展示记录JSON</button><button id="verify" disabled>校验演示文件</button></div><div id="integrity" role="status">正在载入并校验展示数据…</div></header>
<div class="layout"><nav id="catalog" aria-label="五类28项测试"></nav><article id="content" aria-live="polite">正在加载…</article></div><div class="footer">本页展示固定修订的已执行记录；在线重新训练和执行任务请使用完整平台。</div>
<script type="module">
const sceneSha='67d69295bae43805d144ea145a7ff2cbcd8026e186c186f8bd34ede757bcab1d',pdfSha='03aa4e6271baa58c3083dd53d2cdd8841b938cf6e9303cdf8ae4fc6b89a6ec1d';
const $=id=>document.getElementById(id);let data;
const sha=async bytes=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');
async function verified(name,expected){const response=await fetch(new URL(name,location.href));if(!response.ok)throw Error(`文件读取失败：${name} (${response.status})`);const bytes=await response.arrayBuffer();if(await sha(bytes)!==expected)throw Error(`文件校验失败：${name}`);return bytes}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(cls)e.className=cls;return e}
function table(headers,rows){const box=node('div',undefined,'scroll'),t=node('table'),head=node('thead'),hr=node('tr');headers.forEach(h=>hr.append(node('th',h)));head.append(hr);t.append(head);const body=node('tbody');rows.forEach(r=>{const tr=node('tr');r.forEach(c=>tr.append(node('td',c??'—')));body.append(tr)});t.append(body);box.append(t);return box}
function details(title,value){const d=node('details');d.append(node('summary',title),node('pre',JSON.stringify(value,null,2)));return d}
function metric(m){if(m.value===null)return m.reason||'无有效量值';if(m.unit==='ratio')return (m.value*100).toFixed(4)+'%';if(m.unit==='ratio_delta')return (m.value*100).toFixed(4)+' 个百分点';return Number(m.value).toLocaleString('zh-CN',{maximumFractionDigits:8})}
function go(id){location.hash='/scenarios/'+data.spec.scenario_id+'/'+id+'?revision='+data.revision}
function render(){const route=location.hash.match(/^#\/scenarios\/(SC\d{2})\/([A-E]\d{2})\?revision=([a-f0-9]{64})$/);const key=route?.[2];const index=data.types.findIndex(t=>t.id===key);const panel=$('content');panel.replaceChildren();if(!route||route[1]!==data.spec.scenario_id||route[3]!==data.revision||index<0){panel.append(node('h2','链接修订或测试项无效'),node('p','请返回当前演示固定修订。'));const b=node('button','返回第一项');b.onclick=()=>go('A01');panel.append(b);return}const r=data.reports[key],type=data.types[index];document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.key===key?'step':'false'));const step=node('div',undefined,'step'),prev=node('button','上一项'),next=node('button','下一项');prev.disabled=index===0;next.disabled=index===27;prev.onclick=()=>go(data.types[index-1].id);next.onclick=()=>go(data.types[index+1].id);step.append(prev,node('strong',`${index+1} / 28`),next);panel.append(step,node('div',type.group+' / '+key,'eyebrow'),node('h2',type.name),node('p','实测子项已执行 · 整类状态：'+r.implementation_status+' · 正式结论：未判定','status'));panel.append(table(['实测指标','实际结果','单位 / 分母'],r.metrics.map(m=>[m.name,metric(m),m.unit+(m.denominator!=null?` · ${m.numerator}/${m.denominator}`:'')])));
if(key==='A01'&&data.predictions.length){const images=node('div',undefined,'images');data.predictions.slice(0,12).forEach(r=>{const name=`images/${r.index}.png`;if(!data.images[name])return;const f=node('figure'),img=node('img');img.src=name;img.alt='真实样本'+r.index;f.append(img,node('figcaption',`#${r.index} 真值${r.label} / 预测${r.prediction} · ${r.correct?'正确':'错误'}`));images.append(f)});panel.append(node('h3','真实样本预览'),images);const all=node('details');all.append(node('summary','查看全部'+data.predictions.length+'条样本预测'),table(['源索引','真值','预测','置信度','判定'],data.predictions.map(r=>[r.index,r.label,r.prediction,(r.confidence*100).toFixed(2)+'%',r.correct?'正确':'错误'])));panel.append(all)}
if(key==='A04'&&data.epochs.length){panel.append(node('h3','真实逐轮损失 · 蓝：训练 / 橙：验证'));const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 680 170');svg.setAttribute('role','img');svg.setAttribute('aria-label','训练与验证损失曲线');const max=Math.max(.01,...data.epochs.flatMap(r=>[r.train_loss,r.validation_loss]));['train_loss','validation_loss'].forEach((k,i)=>{const line=document.createElementNS(svg.namespaceURI,'polyline');line.setAttribute('fill','none');line.setAttribute('stroke',i?'#c57c37':'#2276a6');line.setAttribute('stroke-width','2.5');line.setAttribute('points',data.epochs.map((r,j)=>`${25+j*630/Math.max(1,data.epochs.length-1)},${145-r[k]/max*125}`).join(' '));svg.append(line)});panel.append(svg)}
panel.append(node('h3','本项范围与判定边界'));const ul=node('ul');r.limits.forEach(s=>ul.append(node('li',s)));panel.append(ul,details('执行配置与范围说明',r.details));panel.append(details('原始证据哈希索引（文件保留于完整平台）',r.artifacts));panel.append(details('模型、数据与执行基线',{...data.spec,source:data.source}));panel.append(node('p','固定修订：'+data.revision,'hash'));}
async function download(name,expected,mime){const bytes=await verified(name,expected);const url=URL.createObjectURL(new Blob([bytes],{type:mime})),a=node('a');a.href=url;a.download=`${data.spec.scenario_id}-${data.revision.slice(0,12)}-${name}`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function act(button,fn){button.disabled=true;try{await fn()}catch(e){$('integrity').textContent=e.message}finally{button.disabled=false}}
try{data=JSON.parse(new TextDecoder().decode(await verified('scene.json',sceneSha)));if(data.types.length!==28||Object.keys(data.reports).length!==28)throw Error('展示记录缺项');$('title').textContent=data.spec.scenario_id+' · '+data.spec.name;let group='';for(const t of data.types){if(t.group!==group){group=t.group;$('catalog').append(node('h2',group))}const b=node('button',t.id+' '+t.name);b.dataset.key=t.id;b.onclick=()=>go(t.id);$('catalog').append(b)}$('integrity').textContent='展示数据SHA-256校验通过 · 28项实测记录 · 修订 '+data.revision.slice(0,12);['pdf','json','verify'].forEach(id=>$(id).disabled=false);$('pdf').onclick=()=>act($('pdf'),()=>download('report.pdf',pdfSha,'application/pdf'));$('json').onclick=()=>act($('json'),()=>download('scene.json',sceneSha,'application/json'));$('verify').onclick=()=>act($('verify'),async()=>{let n=0;for(const [name,hash] of Object.entries({'scene.json':sceneSha,'report.pdf':pdfSha,...data.images})){await verified(name,hash);$('integrity').textContent=`正在核对文件 ${++n}/${2+Object.keys(data.images).length}`} $('integrity').textContent=`${n}个展示文件SHA-256校验通过 · 记录修订 ${data.revision.slice(0,12)}`});window.addEventListener('hashchange',render);if(!location.hash)go('A01');render()}catch(e){$('content').replaceChildren(node('p',e.message,'error'));$('integrity').textContent='加载失败，未展示结果'}
</script></body></html>
